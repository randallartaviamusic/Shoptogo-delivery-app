name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lock"
      - "scripts/**"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      # La CLI de Capacitor 8 necesita Node 22.
      - name: Instalar Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Capacitor 8 compila el módulo Android con Java 21.
      - name: Instalar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # v4 ya no instala el paquete "tools", que Google eliminó. Le pedimos
      # explícitamente la plataforma y las build-tools que usa la app.
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      # Firebase necesita google-services.json para que el APK reciba push
      # nativo. Se puede subir al repo o guardar el contenido en el secreto
      # GOOGLE_SERVICES_JSON; si falta, el APK compila pero no suena cerrado.
      - name: Configurar Firebase para notificaciones
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json configurado desde el secreto."
          elif [ -f android/app/google-services.json ]; then
            echo "Usando android/app/google-services.json del repositorio."
          else
            echo "::warning::Falta google-services.json: el APK compila pero no recibirá push nativo."
          fi

      # Si el administrador subió icono o splash, los bajamos de Convex y los
      # grabamos en el APK. Si no hay nada configurado, deja los originales.
      # El APK tiene que usar el mismo backend que la web publicada: ahí están
      # la cuenta admin, el icono y el video de la splash.
      - name: Aplicar icono y splash del panel admin
        env:
          VITE_CONVEX_URL: https://reminiscent-emu-400.convex.cloud
        run: bun run branding:android

      - name: Compilar la app web
        env:
          VITE_CONVEX_URL: https://reminiscent-emu-400.convex.cloud
          VITE_VLY_APP_ID: ${{ secrets.VITE_VLY_APP_ID }}
          VITE_VLY_MONITORING_URL: ${{ secrets.VITE_VLY_MONITORING_URL }}
        run: bun run build

      - name: Copiar los assets a Android
        run: bunx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar el APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/shop-to-go.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: shop-to-go-apk
          path: apk/shop-to-go.apk
          if-no-files-found: error
          retention-days: 30

      # Desde el celular es más fácil entrar a Releases y tocar el APK que
      # descargar el ZIP del artifact. Cada ejecución deja una release.
      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}-${{ github.run_attempt }}
          name: Shop To Go Android #${{ github.run_number }}
          body: APK de prueba generado automáticamente desde GitHub Actions.
          files: apk/shop-to-go.apk
          prerelease: true
