name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  apk:
    name: Compilar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      # La CLI de Capacitor 8 necesita Node 22.
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar licencias de Android
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Instalar plataforma Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Compilar la app web
        env:
          # Si no cargaste el secret, usa el backend que ya usa la web.
          # Podés sobreescribirlo en Settings → Secrets and variables → Actions.
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || 'https://fastidious-oyster-804.convex.cloud' }}
          VITE_VLY_APP_ID: ${{ secrets.VITE_VLY_APP_ID }}
          VITE_VLY_MONITORING_URL: ${{ secrets.VITE_VLY_MONITORING_URL }}
        run: bun run build

      - name: Copiar los assets a Android
        run: bunx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar el APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/shop-to-go.apk

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: shop-to-go-apk
          path: apk/shop-to-go.apk
          if-no-files-found: error
          retention-days: 30

      # Desde el celular es más fácil entrar a Releases y tocar el APK que
      # descargar el ZIP del artifact. Cada ejecución manual deja una release.
      - name: Publicar APK en Releases
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}-${{ github.run_attempt }}
          name: Shop To Go Android #${{ github.run_number }}
          body: APK de prueba generado automáticamente desde GitHub Actions.
          files: apk/shop-to-go.apk
          prerelease: true
